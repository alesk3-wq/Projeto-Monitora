<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>harness</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<aside id="sidebar"><div id="navBtns"></div><div id="sidebar-footer"></div></aside>
<div class="mobile-topbar" style="display:none;"><div id="navCurrentLabel"></div><button id="navPrev"></button><button id="navNext"></button></div>
<main id="content"></main>
<div id="toast"></div>
<div id="pdf-render-root" style="position:absolute;left:-99999px;top:0;"></div>
<pre id="test-out">AGUARDANDO</pre>
<script type="module">
import './js/main.js';
const out = [];
function assert(nome, cond){ out.push(`${cond?'PASS':'FAIL'} :: ${nome}`); document.getElementById('test-out').textContent = 'PARCIAL\n' + out.join('\n'); }
try{
  const { state } = await import('./js/state.js');
  const v = await import('./js/validacao.js');
  const { resetRolagem } = await import('./js/nav.js');

  // 1. duas plantas
  window.addPlanta();
  assert('addPlanta cria 2ª planta', state.plantas.length===2 && state.plantaAtiva===1);
  state.plantas[0].nome = 'Térreo';
  state.plantas[1].nome = 'Galpão B';

  // 2. pins nas duas (3 + 2) — numeração por tipo, contínua entre plantas
  state.plantas[0].pins.push(
    {id:'b1', tipoId:'bullet', label:'Câmera Bullet', qtd:1, x:10, y:10, direcao:0},
    {id:'d1', tipoId:'dome', label:'Câmera Dome', qtd:1, x:50, y:50, direcao:90},
    {id:'b2', tipoId:'bullet', label:'Câmera Bullet', qtd:1, x:80, y:20, direcao:0});
  state.plantas[1].pins.push(
    {id:'b3', tipoId:'bullet', label:'Bullet Portaria', qtd:1, x:30, y:60, direcao:180},
    {id:'f1', tipoId:'fechadura', label:'Fechadura', qtd:1, x:70, y:70});
  const N = await import('./js/numeracao.js');
  assert('numeroDoPin Térreo = [1,1,2]', [0,1,2].map(i=>N.numeroDoPin(0,i)).join()==='1,1,2');
  const ppt = N.pontosPorTipo();
  assert('pontosPorTipo: bullet, dome, fechadura', ppt.map(g=>g.tipo.id).join()==='bullet,dome,fechadura');
  assert('bullet 1,2,3 com o 3º no Galpão B', ppt[0].pontos.map(p=>p.numero).join()==='1,2,3' && ppt[0].pontos[2].plantaIdx===1);

  // 3. aba planta: seletor com 2 abas + botão add; lista numera 3 e 1 na planta 2
  window.switchTab('planta');
  const tabs = document.querySelectorAll('.planta-tab');
  assert('seletor tem 3 botões (2 plantas + add)', tabs.length===3);
  assert('aba ativa é Galpão B', document.querySelector('.planta-tab.active')?.textContent==='Galpão B');
  const nums = [...document.querySelectorAll('.pinrow b')].map(b=>b.textContent);
  assert('lista da planta 2 numera 3 e 1', nums[0]==='3' && nums[1]==='1');
  {
    const cvB = document.createElement('canvas'); cvB.width = 100; cvB.height = 100;
    state.plantas[1].imagem = cvB.toDataURL('image/png'); window.renderContent();
    const bd = i=>document.querySelector('#pinicon-'+i+' span')?.textContent;
    assert('badges do Galpão B = 3 e 1', bd(0)==='3' && bd(1)==='1');
    state.plantas[1].imagem = null; window.renderContent();
  }

  // 4. fichas: números por tipo e subtítulo por planta
  window.switchTab('equipamentos');
  const html = document.getElementById('content').innerHTML;
  assert('ficha Câmera Bullet — Ponto 3 existe e não há Equipamento 4', html.includes('Câmera Bullet — Ponto 3') && !html.includes('Equipamento 4'));
  const ordem = ['Câmera Bullet — Ponto 1','Câmera Bullet — Ponto 2','Câmera Bullet — Ponto 3','Câmera Dome — Ponto 1','Fechadura Eletrônica — Ponto 1'].map(t=>html.indexOf(t));
  assert('ordem das fichas por tipo', ordem.every((v,i)=>v>=0 && (i===0 || v>ordem[i-1])));
  assert('subtítulo da planta aparece', html.includes('Planta — Térreo') && html.includes('Planta — Galpão B'));

  // 5. Estrutura sincronizada, agrupada por tipo
  {
    const ES = await import('./js/tabs/estrutura.js');
    const PD = await import('./js/pdf.js');
    const titulos = ()=>ES.gruposGerados().map(g=>g.titulo);
    const linhaDe = id=>ES.gruposGerados().flatMap(g=>g.linhas).find(l=>l.id===id);
    assert('legendaFicha sem seção gerada = vazia', PD.legendaFicha(state.plantas[0].pins[0])==='');
    const nManualAntes = state.estrutura.length;
    state.estrutura.push({titulo:'Manual', itens:[{qtd:2, nome:'Sirene', desc:'Pátio'}]});
    window.importFromPlanta();
    assert('importFromPlanta cria 1 seção gerada', state.estrutura.filter(g=>g.gerado).length===1);
    window.importFromPlanta();
    assert('importFromPlanta de novo não duplica', state.estrutura.filter(g=>g.gerado).length===1);
    assert('títulos por tipo (NNx)', titulos().join('|')==='03x Câmera Bullet|01x Câmera Dome|01x Fechadura Eletrônica');
    assert('linha do 3º bullet com prefixo da planta', linhaDe('b3')?.texto==='Galpão B — Ponto 3 — Bullet Portaria');
    // cerca
    state.plantas[0].cercas.push({id:'c1', label:'Muro Norte', pontos:[{x:1,y:1},{x:9,y:9}]});
    assert('grupo de cerca por último', titulos().join('|')==='03x Câmera Bullet|01x Câmera Dome|01x Fechadura Eletrônica|01x Cerca / Concertina'
      && linhaDe('c1')?.texto==='Térreo — Trecho 1 — Muro Norte');
    state.plantas[0].cercas.length = 0;
    // qtd 2
    state.plantas[0].pins[2].qtd = 2;
    assert('qtd 2 soma no cabeçalho e marca (2x)', titulos()[0]==='04x Câmera Bullet' && linhaDe('b2').texto.includes('(2x)'));
    state.plantas[0].pins[2].qtd = 1;
    // descrição acompanha o pin
    window.setDescGerada('d1', 'Portaria');
    const grupoCom = txt=>ES.gruposGerados().filter(g=>g.linhas.some(l=>l.desc===txt)).map(g=>g.tipoId);
    assert('descrição aparece na linha', linhaDe('d1').desc==='Portaria' && grupoCom('Portaria').join()==='dome');
    state.plantas[0].pins[1].tipoId = 'bullet';
    assert('trocar tipo leva a descrição pro novo grupo', grupoCom('Portaria').join()==='bullet' && titulos()[0]==='04x Câmera Bullet');
    state.plantas[0].pins[1].tipoId = 'dome';
    // ficha <-> item por id
    const leg = PD.legendaFicha(state.plantas[0].pins[1]);
    assert('legendaFicha casa por id (texto + descrição)', leg.includes('Ponto 1 — Câmera Dome') && leg.includes('Portaria'));
    assert('legendaFicha sem descrição ainda mostra a linha', PD.legendaFicha(state.plantas[1].pins[0]).includes('Galpão B — Ponto 3 — Bullet Portaria'));
    // aba
    window.switchTab('estrutura');
    const heads = [...document.querySelectorAll('.gerado-head')];
    assert('aba: cabeçalho gerado com ícone do tipo', heads.length===3 && heads.every(h=>h.querySelector('.icon-dot svg')) && heads[0].textContent.includes('03x Câmera Bullet'));
    const descInputs = document.querySelectorAll('.gerado-linha input');
    assert('aba: um input de descrição por linha', descInputs.length===5 && [...descInputs].some(i=>i.value==='Portaria'));
    assert('aba: grupo manual continua editável', document.querySelectorAll('.item-row .qtd, .item-row .nome, .item-row .desc').length===3);
    descInputs[0].value = 'Doca'; descInputs[0].dispatchEvent(new Event('input', {bubbles:true}));
    assert('aba: input grava a descrição', linhaDe(ES.gruposGerados()[0].linhas[0].id).desc==='Doca');
    // contadores e validação
    window.switchTab('gerar');
    const st = [...document.querySelectorAll('.stat .n')].map(e=>e.textContent);
    assert('contadores incluem grupos gerados', st[0]==='4' && st[1]==='7');
    const salvo = state.estrutura.slice();
    state.estrutura = salvo.filter(g=>g.gerado);
    assert('validação: só seção gerada com pins = OK', !v.validarProposta().some(p=>p.campo==='estrutura'));
    // seção sem pins
    const pinsSalvos = state.plantas.map(pl=>pl.pins);
    state.plantas.forEach(pl=>pl.pins=[]);
    window.switchTab('estrutura');
    const htmlVazio = document.getElementById('content').innerHTML;
    assert('aba: seção vazia mostra dica', htmlVazio.includes('Nenhum equipamento na planta') && !document.querySelector('.gerado-head'));
    assert('PDF: seção vazia sem cabeçalho', !/\d\dx /.test(PD.pageEstrutura().split('Legenda')[0]));
    assert('validação: seção vazia = pendência', v.validarProposta().some(p=>p.campo==='estrutura'));
    state.plantas.forEach((pl,i)=>pl.pins=pinsSalvos[i]);
    state.estrutura = salvo;
    // PDF Estrutura
    const est = PD.pageEstrutura();
    assert('PDF Estrutura: grupo gerado com ícone e linhas', est.includes('03x Câmera Bullet') && est.includes('Ponto 1 — Câmera Dome</b>: Portaria') && est.includes('<svg') && est.includes('Sirene') && !est.includes('clip-path'));
    // excluir o pin leva a descrição embora
    const dRem = state.plantas[0].pins.splice(1,1)[0];
    assert('excluir pin some com a descrição', grupoCom('Portaria').length===0);
    state.plantas[0].pins.splice(1,0,dRem);
    // .json antigo
    const P = await import('./js/persistence.js');
    const antigoE = P.normalizarProjeto({estrutura:[{titulo:'Equipamentos Mapeados', itens:[{qtd:1,nome:'Câmera — Ponto 7',desc:''}]}], plantas:[{pins:[]}]});
    assert('grupo antigo continua manual', !antigoE.estrutura[0].gerado && antigoE.estrutura[0].itens.length===1);
    const salvo2 = state.estrutura; state.estrutura = antigoE.estrutura;
    window.switchTab('estrutura');
    assert('aba renderiza grupo antigo', document.querySelectorAll('.item-row').length===1);
    state.estrutura = salvo2;
    // remover seção gerada
    const conf0 = window.confirm; window.confirm = ()=>true;
    window.switchTab('estrutura');
    window.removeSecaoGerada();
    window.confirm = conf0;
    assert('remover seção gerada', !state.estrutura.some(g=>g.gerado) && state.estrutura.length===nManualAntes+1);
    state.estrutura.length = nManualAntes;
    // uma planta só: sem prefixo
    const pl2 = state.plantas.splice(1,1)[0];
    assert('uma planta: linha sem prefixo', linhaDe('b1')?.texto==='Ponto 1 — Câmera Bullet');
    state.plantas.splice(1,0,pl2);
  }

  // 5b. ids estáveis e renumeração ao excluir
  {
    const P = await import('./js/persistence.js');
    const norm = P.normalizarProjeto({plantas:[{pins:[{tipoId:'bullet'},{tipoId:'dome'}], cercas:[{label:'c',pontos:[]}]},{pins:[{tipoId:'bullet'}]}]});
    const ids = [...norm.plantas[0].pins, ...norm.plantas[1].pins, ...norm.plantas[0].cercas].map(x=>x.id);
    assert('normalizarProjeto preenche ids distintos', ids.every(i=>typeof i==='string' && i) && new Set(ids).size===ids.length);

    const cv0 = document.createElement('canvas'); cv0.width = 400; cv0.height = 400;
    const nP0 = state.plantas[1].pins.length;
    state.plantaAtiva = 1; state.plantas[1].imagem = cv0.toDataURL('image/png'); state.plantas[1].selectedTipo = 'dome';
    window.switchTab('planta');
    await new Promise(r=>setTimeout(r,100));
    const im0 = document.getElementById('plantaImg');
    const rc = im0.getBoundingClientRect();
    im0.dispatchEvent(new MouseEvent('click', {bubbles:true, clientX:rc.left+20, clientY:rc.top+20}));
    im0.dispatchEvent(new MouseEvent('click', {bubbles:true, clientX:rc.left+40, clientY:rc.top+40}));
    const novos = state.plantas[1].pins.slice(nP0);
    assert('pins criados por clique têm id distinto', novos.length===2 && novos.every(p=>typeof p.id==='string' && p.id) && novos[0].id!==novos[1].id);
    state.plantas[1].pins.length = nP0; state.plantas[1].imagem = null; state.plantas[1].selectedTipo = 'bullet';
    state.plantaAtiva = 1;

    // excluir o 1º pin do Térreo (bullet): bullet do Térreo vira 1, o do Galpão 2, dome continua 1
    state.plantaAtiva = 0;
    window.removePin(0);
    const antes = [N.numeroDoPin(0,1), N.numeroDoPin(1,0), N.numeroDoPin(0,0)];
    assert('excluir 1º bullet renumera por tipo', antes.join()==='1,2,1');
    state.plantas[0].pins.unshift({id:'x-restaurado', tipoId:'bullet', label:'Câmera Bullet', qtd:1, x:10, y:10, direcao:0});
    state.plantaAtiva = 1;
    window.switchTab('estrutura');
  }

  // 6. contadores da aba Gerar somam tudo
  window.switchTab('gerar');
  const stats = [...document.querySelectorAll('.stat .n')].map(e=>e.textContent);
  assert('total de pontos = 5', stats[2]==='5');

  // 7. validação multi-planta
  const campos = v.validarProposta().map(p=>p.campo);
  assert('valida fichas de todas as plantas', v.validarProposta().find(p=>p.campo==='fichas')?.msg.startsWith('5'));

  // 8. export não vaza o alias
  const json = JSON.stringify(state);
  assert('JSON tem plantas e não tem alias', json.includes('"plantas"') && !json.includes('"planta":'));

  // 9. round-trip de migração (simula o normalizador do import com objeto antigo)
  const antigo = {projeto:{unidade:'X'}, objetivo:{}, estrutura:[], premissas:[], planta:{imagem:null, pins:[{tipoId:'bullet',x:1,y:1}], zoom:100}};
  // replica exatamente o bloco de migração de persistence.js:
  if(antigo.planta && !antigo.plantas){ antigo.plantas=[antigo.planta]; delete antigo.planta; }
  assert('migração de .json antigo', antigo.plantas.length===1 && antigo.plantas[0].pins.length===1);

  // 9b. sensor de abertura de porta
  const C = await import('./js/constants.js');
  window.switchTab('planta');
  assert('sensor na toolbar', [...document.querySelectorAll('.type-btn')].some(b=>b.textContent.includes('Sensor de Abertura de Porta')));
  const iSens = C.EQUIP_TYPES.findIndex(t=>t.id==='sensor_porta'), iOutro = C.EQUIP_TYPES.findIndex(t=>t.id==='outro');
  assert('sensor antes de Outro', iSens>=0 && iSens===iOutro-1);
  const nGrp = state.estrutura.length, nPins = state.plantas[0].pins.length;
  state.plantas[0].pins.push({tipoId:'sensor_porta', label:'Sensor de Abertura de Porta', qtd:1, x:5, y:5});
  window.importFromPlanta();
  {
    const ES = await import('./js/tabs/estrutura.js');
    assert('sensor gera grupo na Estrutura', ES.gruposGerados().some(g=>g.titulo==='01x Sensor de Abertura de Porta'));
  }
  state.plantas[0].pins.length = nPins; state.estrutura.length = nGrp;

  // ---- helpers async (usados daqui em diante) ----
  const frame = ()=>new Promise(r=>{ requestAnimationFrame(()=>r()); setTimeout(r, 50); });
  const waitImg = async ()=>{
    const im = document.getElementById('plantaImg');
    if(im && !im.complete) await new Promise(r=>{ im.addEventListener('load', r, {once:true}); im.addEventListener('error', r, {once:true}); });
    await frame(); await frame();
  };
  const cv = document.createElement('canvas'); cv.width = 2000; cv.height = 2000;
  const cx = cv.getContext('2d'); cx.fillStyle = '#ddd'; cx.fillRect(0,0,2000,2000);
  const bigImg = cv.toDataURL('image/png');
  const near = (a,b,t=2)=>Math.abs(a-b)<=t;

  // 9c. etiquetas
  {
    const S = await import('./js/state.js');
    const U = await import('./js/utils.js');
    const P = await import('./js/persistence.js');
    const E = await import('./js/tabs/etiquetas.js');
    const np = S.novaPlanta('X');
    assert('novaPlanta tem etiquetas', Array.isArray(np.etiquetas) && np.etiquetas.length===0);
    assert('escHtml', U.escHtml('a"<b>&\'')==='a&quot;&lt;b&gt;&amp;&#39;' && U.escHtml(null)==='' && U.escHtml(undefined)==='');
    const norm = P.normalizarProjeto({plantas:[{pins:[]}]});
    assert('import sem etiquetas', Array.isArray(norm.plantas[0].etiquetas) && norm.plantas[0].etiquetas.length===0);

    const totalPins = state.plantas.reduce((s,pl)=>s+pl.pins.length,0);
    window.switchTab('equipamentos');
    const nFichas0 = document.querySelectorAll('#content .card').length;
    const pl = state.planta;
    const oldImg = pl.imagem, oldTipo = pl.selectedTipo, oldZoom = pl.zoom, nGrpE = state.estrutura.length, nPinsE = pl.pins.length;
    pl.imagem = bigImg; pl.zoom = 100;
    window.switchTab('planta'); await waitImg();
    window.selectTipo('etiqueta'); await waitImg();
    const btnEtq = [...document.querySelectorAll('.type-btn')].find(b=>b.textContent.includes('Etiqueta'));
    assert('botão Etiqueta na toolbar', !!btnEtq && btnEtq.classList.contains('active'));

    const im = document.getElementById('plantaImg');
    const r = im.getBoundingClientRect();
    im.dispatchEvent(new MouseEvent('click', {bubbles:true, clientX:r.left+r.width/2, clientY:r.top+r.height/2}));
    await frame();
    const e0 = state.planta.etiquetas[0];
    assert('clique cria etiqueta', state.planta.etiquetas.length===1 && state.planta.pins.length===nPinsE
      && e0 && near(e0.ax,50,1) && near(e0.ay,50,1) && e0.texto==='Nova etiqueta'
      && document.activeElement && document.activeElement.id==='etqtxt-0');
    const boxes = document.querySelectorAll('#plantaWrap .etq-box');
    assert('etiqueta renderiza', boxes.length===1 && boxes[0].textContent==='Nova etiqueta' && document.querySelectorAll('#plantaWrap .etq-tip').length===1);

    const perigoso = 'porta "fantasma" <x>';
    state.planta.etiquetas[0].texto = perigoso;
    window.renderContent(); await frame();
    assert('texto perigoso não quebra', document.getElementById('etqtxt-0')?.value===perigoso
      && document.querySelector('#plantaWrap .etq-box')?.textContent===perigoso);

    window.importFromPlanta();
    const ES = await import('./js/tabs/estrutura.js');
    const vazou = ES.gruposGerados().some(g=>g.linhas.some(l=>/Nova etiqueta|fantasma/.test(l.texto+' '+l.desc)));
    window.switchTab('gerar');
    const statsE = [...document.querySelectorAll('.stat .n')].map(e=>e.textContent);
    window.switchTab('equipamentos');
    const nFichas1 = document.querySelectorAll('#content .card').length;
    assert('etiqueta não vira equipamento', !vazou && statsE[2]===String(totalPins) && nFichas1===nFichas0);

    const g = E.etqGeom(10,10,100,40, 60,30);
    assert('ponta sobre a caixa', [g.x1,g.y1,g.len,g.ang].every(Number.isFinite) && g.len===0);

    // caixa nasce dentro da imagem mesmo clicando na borda direita/topo; seta visível sob o anel
    window.switchTab('planta'); await waitImg();
    const im2 = document.getElementById('plantaImg'), r2 = im2.getBoundingClientRect();
    im2.dispatchEvent(new MouseEvent('click', {bubbles:true, clientX:r2.right-2, clientY:r2.top+2}));
    await frame();
    const iN = state.planta.etiquetas.length-1, eN = state.planta.etiquetas[iN];
    let wN = document.getElementById('plantaWrap'), bN = document.getElementById('etqbox-'+iN);
    const nasceuDentro = eN.x + bN.offsetWidth/wN.offsetWidth*100 <= 100.01;
    // arrasta a caixa (texto longo) muito além da borda inferior-direita
    eN.texto = 'Texto bem longo para a caixa ficar larga e alta '.repeat(3);
    window.renderContent(); await frame();
    wN = document.getElementById('plantaWrap'); bN = document.getElementById('etqbox-'+iN);
    const rb = bN.getBoundingClientRect();
    bN.dispatchEvent(new PointerEvent('pointerdown', {bubbles:true, isPrimary:true, clientX:rb.left+3, clientY:rb.top+3}));
    document.dispatchEvent(new PointerEvent('pointermove', {bubbles:true, isPrimary:true, clientX:rb.left+5000, clientY:rb.top+5000}));
    document.dispatchEvent(new PointerEvent('pointerup', {bubbles:true, isPrimary:true}));
    await frame();
    assert('caixa dentro da imagem', nasceuDentro && eN.x + bN.offsetWidth/wN.offsetWidth*100 <= 100.01 && eN.y >= 0 && eN.y + bN.offsetHeight/wN.offsetHeight*100 <= 100.01);
    const arN = document.getElementById('etqarrow-'+iN), tpN = document.getElementById('etqtip-'+iN);
    assert('seta visível (anel vazado)', getComputedStyle(arN).display!=='none' && getComputedStyle(tpN).backgroundColor==='rgba(0, 0, 0, 0)');

    // limpeza
    state.estrutura.length = nGrpE;
    pl.etiquetas = []; pl.imagem = oldImg; pl.selectedTipo = oldTipo; pl.zoom = oldZoom;
    window.switchTab('planta');
  }

  // 9b. etiquetas no PDF (funções puras de pdf.js)
  {
    const P = await import('./js/pdf.js');
    const rect = {x:0,y:0,w:1000,h:500};
    const html = P.etiquetasHtml({etiquetas:[{texto:'porta "x" <b>', x:20,y:20,ax:40,ay:40}]}, rect);
    assert('etiqueta no PDF', html.includes('porta &quot;x&quot; &lt;b&gt;') && !html.includes('clip-path') && !html.includes('<svg'));
    const htmlC = P.etiquetasHtml({etiquetas:[{texto:'dentro', x:20,y:20,ax:22,ay:22}]}, rect);
    assert('ponta sobre a caixa no PDF', !htmlC.includes('NaN') && !htmlC.includes('Infinity'));
    const vazia = {imagem:null, pins:[], cercas:[], areas:[], etiquetas:[{texto:'a',x:1,y:1,ax:2,ay:2}]};
    assert('planta só com etiqueta não é pulada', P.plantaVazia(vazia)===false && P.plantaVazia({...vazia, etiquetas:[]})===true);
    const rect2 = {x:50,y:30,w:800,h:400};
    const htmlB = P.etiquetasHtml({etiquetas:[{texto:'canto inferior direito longo '.repeat(3), x:99,y:99,ax:50,ay:50}]}, rect2);
    const mB = htmlB.match(/etq-pdf-box" style="position:absolute;left:([\d.]+)px;top:([\d.]+)px;width:([\d.]+)px/);
    const est = P.etqEstimaCaixa('canto inferior direito longo '.repeat(3));
    assert('caixa clampada dentro da imagem no PDF', !!mB && +mB[1]+est.w <= rect2.x+rect2.w+0.01 && +mB[2]+est.h <= rect2.y+rect2.h+0.01 && +mB[1]>=rect2.x && +mB[2]>=rect2.y);
  }

  // 9c. fixes do review final
  {
    const P = await import('./js/pdf.js');
    // M-1: linhas/setas de todas as etiquetas antes de qualquer caixa
    const h2 = P.etiquetasHtml({etiquetas:[
      {texto:'um', x:10,y:10,ax:60,ay:60}, {texto:'dois', x:70,y:10,ax:20,ay:70}]}, {x:0,y:0,w:1000,h:500});
    const iBox1 = h2.indexOf('etq-pdf-box');
    const iUltLinha = Math.max(h2.lastIndexOf('transform-origin:0 1px'), h2.lastIndexOf('border-top:12px'));
    assert('PDF: linhas/setas antes das caixas', iBox1 > 0 && iUltLinha > 0 && iUltLinha < iBox1);

    // M-2: alça da ponta abaixo dos pins fora do modo etiqueta, acima com a ferramenta
    const plc = state.planta, oldTipoC = plc.selectedTipo, oldImgC = plc.imagem, oldZoomC = plc.zoom;
    plc.imagem = bigImg; plc.zoom = 100;
    plc.etiquetas = [{texto:'t', x:10,y:10,ax:50,ay:50}];
    window.selectTipo('dome'); await waitImg();
    const zOutro = +getComputedStyle(document.querySelector('#plantaWrap .etq-tip')).zIndex;
    window.selectTipo('etiqueta'); await waitImg();
    const zEtq = +getComputedStyle(document.querySelector('#plantaWrap .etq-tip')).zIndex;
    assert('alça da ponta: abaixo dos pins (z<3) fora do modo, acima no modo etiqueta', zOutro < 3 && zEtq > 3);

    // M-3: nova imagem começa do topo/esquerda
    plc.zoom = 200; window.selectTipo('dome'); await waitImg();
    const scM = document.getElementById('plantaScroll');
    scM.scrollLeft = 300; scM.scrollTop = 300;
    const scrolou = scM.scrollTop > 0;
    resetRolagem(); window.renderContent(); await waitImg();
    const scM2 = document.getElementById('plantaScroll');
    assert('resetRolagem: próximo render começa do topo', scrolou && scM2.scrollTop===0 && scM2.scrollLeft===0);

    plc.etiquetas = []; plc.imagem = oldImgC; plc.selectedTipo = oldTipoC; plc.zoom = oldZoomC;
    window.switchTab('planta');
  }

  // 9d. legenda da página Estrutura = resumo por tipo do projeto inteiro
  {
    const PDL = await import('./js/pdf.js');
    const S = await import('./js/state.js');
    const salvo = state.plantas;
    const a = S.novaPlanta('A'), b = S.novaPlanta('B');
    const mk = (id,t,l,q=1)=>({id, tipoId:t, label:l, qtd:q, x:5, y:5, direcao:0});
    a.pins.push(mk('l1','bullet','Portaria'), mk('l2','dome','Pátio'), mk('l3','bullet','Doca',2));
    b.pins.push(mk('l4','bullet','Galpão'));
    a.cercas.push({id:'lc1', label:'Muro', pontos:[{x:1,y:1},{x:2,y:2}]});
    b.cercas.push({id:'lc2', label:'Muro 2', pontos:[{x:1,y:1},{x:2,y:2}]});
    a.areas.push({catId:'area1', descricao:'Oficina', x:1, y:1, w:5, h:5});
    state.plantas = [a, b];
    const r = PDL.legendaResumo();
    assert('legenda: uma linha por tipo, soma qtd, cerca conta trechos',
      JSON.stringify(r)===JSON.stringify([{tipoId:'bullet',qtd:4},{tipoId:'dome',qtd:1},{tipoId:'cerca',qtd:2}]));
    const leg = PDL.pageEstrutura().split('Legenda')[1] || '';
    assert('legenda no PDF: "04x — Câmera Bullet" e sem rótulo de pin', leg.includes('04x — Câmera Bullet') && leg.includes('01x — Câmera Dome') && leg.includes('02x — Cerca / Concertina') && !leg.includes('Portaria'));
    assert('legenda no PDF: área com nome da planta (multi)', leg.includes('A — Área 1') && leg.includes('Oficina'));
    state.plantas = salvo;
  }

  // 9e. Objetivo com estrutura (lista/subtítulo/parágrafo) e frase fixa nas Premissas
  {
    const PDT = await import('./js/pdf.js');
    const h = PDT.textoEstruturado('Intro:\n• Item A\n- Item <B>\n\nParágrafo "final".');
    assert('texto estruturado: subtítulo, 2 itens de lista e parágrafo escapado',
      (h.match(/padding-left:34px/g)||[]).length===2 && h.includes('font-weight:700') && h.includes('Item &lt;B&gt;') && h.includes('Parágrafo &quot;final&quot;.') && !h.includes('- Item'));
    assert('texto estruturado vazio = travessão', PDT.textoEstruturado('  \n ').includes('—'));
    assert('Considerações finais: padrão = frase do CCOS, entre aspas no PDF', PDT.pagePremissas().includes('“Todo o ecossistema será integrado à Central de Monitoramento CCOS | Bracell'));
    const salvoC = state.consideracoes;
    state.consideracoes = '"Texto <livre> do usuário"';
    const pc = PDT.pagePremissas();
    assert('Considerações finais: texto digitado, escapado, itálico, sem aspas duplicadas', pc.includes('“Texto &lt;livre&gt; do usuário”') && pc.includes('font-style:italic') && !pc.includes('““'));
    state.consideracoes = '   ';
    assert('Considerações finais vazia: nada no PDF', !PDT.pagePremissas().includes('font-style:italic'));
    const PSn = await import('./js/persistence.js');
    assert('.json antigo sem consideracoes recebe a frase padrão', PSn.normalizarProjeto({plantas:[{pins:[]}]}).consideracoes.startsWith('Todo o ecossistema'));
    state.consideracoes = salvoC;
    window.switchTab('premissas');
    assert('aba Premissas tem a caixa Considerações finais', document.getElementById('content').innerHTML.includes('Considerações finais'));
  }

  // 10. remover a planta 2 renumera
  state.plantaAtiva = 1;
  state.plantas.splice(1,1); state.plantaAtiva = 0;
  window.switchTab('planta');
  const nums2 = [...document.querySelectorAll('.pinrow b')].map(b=>b.textContent);
  assert('após excluir planta 2, planta 1 numera 1,1,2', nums2.join()==='1,1,2');

  // ---- Rolagem estável / planta larga ----
  state.plantaAtiva = 0;
  state.planta.imagem = bigImg; state.planta.zoom = 200; state.planta.pins = [];
  window.switchTab('planta'); await waitImg();
  let sc = document.getElementById('plantaScroll');
  sc.scrollLeft = 500; sc.scrollTop = 400;
  window.selectTipo('dome'); await waitImg();
  sc = document.getElementById('plantaScroll');
  assert('rolagem preservada ao adicionar pin', near(sc.scrollLeft,500) && near(sc.scrollTop,400));

  window.addPlanta(); await frame();
  state.plantas[1].imagem = bigImg; state.plantas[1].zoom = 200;
  window.selectPlanta(0); await waitImg();
  sc = document.getElementById('plantaScroll');
  sc.scrollLeft = 500; sc.scrollTop = 400;
  window.selectPlanta(1); await waitImg();
  sc = document.getElementById('plantaScroll');
  assert('rolagem zera ao trocar de planta', sc.scrollLeft===0 && sc.scrollTop===0);
  window.selectPlanta(0); await waitImg();

  sc = document.getElementById('plantaScroll');
  sc.scrollLeft = 500; sc.scrollTop = 400;
  let wrap = document.getElementById('plantaWrap');
  const fx0 = (sc.scrollLeft + sc.clientWidth/2)/wrap.offsetWidth;
  const fy0 = (sc.scrollTop + sc.clientHeight/2)/wrap.offsetHeight;
  window.zoomPlanta(20); await waitImg();
  sc = document.getElementById('plantaScroll'); wrap = document.getElementById('plantaWrap');
  const fx1 = (sc.scrollLeft + sc.clientWidth/2)/wrap.offsetWidth;
  const fy1 = (sc.scrollTop + sc.clientHeight/2)/wrap.offsetHeight;
  assert('zoom ancora no centro', Math.abs(fx1-fx0)<0.01 && Math.abs(fy1-fy0)<0.01);

  window.switchTab('planta');
  const wideP = document.getElementById('content').classList.contains('wide');
  window.switchTab('projeto');
  const wideJ = document.getElementById('content').classList.contains('wide');
  assert('content largo só na Planta', wideP && !wideJ);

  // 7. fixes do review final
  {
    const PD2 = await import('./js/pdf.js');
    const h1 = PD2.pageEquipamento({tipoId:'bullet', label:'Portaria <1>', qtd:1}, 2, null);
    assert('ficha PDF: título com Ponto N e rótulo escapado', h1.includes('Câmera Bullet — Ponto 2 — Portaria &lt;1&gt;'));
    const h2 = PD2.pageEquipamento({tipoId:'bullet', label:'Câmera Bullet', qtd:1}, 3, null);
    assert('ficha PDF: rótulo igual ao tipo não repete', h2.includes('Câmera Bullet — Ponto 3') && !h2.includes('Ponto 3 — Câmera Bullet'));
    const h3 = PD2.pageEquipamento({tipoId:'bullet', label:'X', qtd:1}, 1, 'data:image/png;base64,AAAA');
    assert('ficha PDF sem fotos: sem quadros vazios, recorte ampliado e centralizado',
      !h3.includes('Foto não anexada') && !h3.includes('Local de Instalação') && !h3.includes('Visualização Esperada') && h3.includes('height:490px') && h3.includes('justify-content:center'));
    const h4 = PD2.pageEquipamento({tipoId:'bullet', label:'X', qtd:1, fotoView:'data:image/png;base64,BBBB'}, 1, 'data:image/png;base64,AAAA');
    assert('ficha PDF com 1 foto: só o quadro que falta sai, padrão mantido',
      h4.includes('Visualização Esperada') && !h4.includes('Local de Instalação') && !h4.includes('Foto não anexada') && !h4.includes('height:490px'));

    state.plantaAtiva = 0;
    const pl0 = state.plantas[0];
    const nPins0 = pl0.pins.length;
    pl0.pins.push({id:'zz-bul', tipoId:'bullet', label:'', qtd:1, x:5, y:5, direcao:0});
    window.switchTab('planta'); await frame();
    const sel0 = [...document.querySelectorAll('.pinrow select')].find(x=>[...x.options].some(o=>o.value==='bullet'));
    assert('select de pin sem opção cerca', !!sel0 && ![...sel0.options].some(o=>o.value==='cerca'));
    pl0.pins.push({id:'zz-cerca', tipoId:'cerca', label:'', qtd:1, x:5, y:5, direcao:0});
    window.switchTab('planta'); await frame();
    const sels = [...document.querySelectorAll('.pinrow select')];
    assert('pin antigo tipo cerca mantém a opção', sels[sels.length-1].value==='cerca');
    pl0.pins.length = nPins0;

    const P2 = await import('./js/persistence.js');
    const nz = P2.normalizarProjeto({plantas:[{pins:[{id:'p1',tipoId:'bullet'}],cercas:[{id:'c1',pontos:[]}]}], estrutura:[{gerado:true, descs:{p1:'a', c1:'b', fantasma:'x'}}]});
    const dn = nz.estrutura[0].descs;
    assert('normalizar poda descrições órfãs', dn.p1==='a' && dn.c1==='b' && !('fantasma' in dn));

    const salvoE = state.estrutura;
    state.estrutura = [{gerado:true, descs:{fantasma:'texto órfão'}}];
    let perguntou = false; const cf = window.confirm; window.confirm = ()=>{ perguntou = true; return true; };
    window.switchTab('estrutura');
    window.removeSecaoGerada();
    assert('remover seção só com órfãs não pergunta', !perguntou && state.estrutura.length===0);
    pl0.pins.push({id:'zz-bul', tipoId:'bullet', label:'', qtd:1, x:5, y:5, direcao:0});
    state.estrutura = [{gerado:true, descs:{'zz-bul':'texto vivo'}}];
    window.removeSecaoGerada();
    window.confirm = cf; pl0.pins.length = nPins0;
    assert('remover seção com desc viva pergunta', perguntou);
    state.estrutura = salvoE;
  }
}catch(err){
  out.push('ERRO :: ' + (err && err.stack || err));
}
document.getElementById('test-out').textContent = 'RESULTADOS\n' + out.join('\n');
</script>
</body>
</html>
